<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111118;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px;
    justify-content: center;
    align-items: flex-start;
    font-family: monospace;
    color: #aaa;
  }
  .view { background: #0a0a12; border: 1px solid #333; padding: 8px; }
  h3 { color: #00ffd4; margin-bottom: 4px; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>

<!-- FRONT — with scene palette -->
<div class="view">
  <h3>FRONT — Scene Palette</h3>
  <svg width="520" height="480" viewBox="0 0 520 480">
    <rect width="520" height="480" fill="#0a0a12"/>

    <!-- 1. WALL — STRUCTURE_1 (#1a1a2e) -->
    <rect x="20" y="10" width="480" height="420" fill="#1a1a2e" stroke="#242440" stroke-width="2"/>

    <!-- 2. FRAME — STRUCTURE_3 (#2e2e52) -->
    <circle cx="260" cy="220" r="185" fill="#242440"/>
    <circle cx="260" cy="220" r="180" fill="none" stroke="#2e2e52" stroke-width="8"/>

    <!-- 3. DOOR — CONCRETE (#3a3a4a) brighter than wall -->
    <circle cx="260" cy="220" r="170" fill="#3a3a4a"/>

    <!-- 4. SPINDLE WHEEL — CYAN (#00ffd4) the hero accent -->
    <circle cx="260" cy="220" r="65" fill="none" stroke="#00ffd4" stroke-width="8"/>
    <line x1="260" y1="220" x2="260" y2="155" stroke="#00ffd4" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="220" x2="322" y2="200" stroke="#00ffd4" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="220" x2="298" y2="272" stroke="#00ffd4" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="220" x2="222" y2="272" stroke="#00ffd4" stroke-width="9" stroke-linecap="round"/>
    <line x1="260" y1="220" x2="198" y2="200" stroke="#00ffd4" stroke-width="9" stroke-linecap="round"/>
    <circle cx="260" cy="220" r="16" fill="#00ffd4"/>
    <circle cx="260" cy="220" r="6" fill="#007a66"/>

    <!-- 5. COMBINATION DIAL — STRUCTURE_3 with cyan indicator -->
    <circle cx="340" cy="310" r="22" fill="#2e2e52" stroke="#3a3a4a" stroke-width="2"/>
    <circle cx="340" cy="310" r="15" fill="#242440"/>
    <circle cx="340" cy="310" r="3" fill="#3a3a4a"/>
    <!-- Dial indicator mark -->
    <line x1="340" y1="289" x2="340" y2="295" stroke="#00ffd4" stroke-width="1.5"/>
    <!-- Subtle tick marks -->
    <line x1="361" y1="310" x2="357" y2="310" stroke="#3a3a4a" stroke-width="0.8"/>
    <line x1="340" y1="331" x2="340" y2="327" stroke="#3a3a4a" stroke-width="0.8"/>
    <line x1="319" y1="310" x2="323" y2="310" stroke="#3a3a4a" stroke-width="0.8"/>

    <!-- 6. HINGES — STRUCTURE_2 (#242440) with CONCRETE bolt heads -->
    <rect x="30" y="100" width="44" height="48" rx="3" fill="#242440" stroke="#2e2e52" stroke-width="1.5"/>
    <circle cx="42" cy="114" r="4" fill="#3a3a4a"/>
    <circle cx="62" cy="114" r="4" fill="#3a3a4a"/>
    <circle cx="42" cy="136" r="4" fill="#3a3a4a"/>
    <circle cx="62" cy="136" r="4" fill="#3a3a4a"/>

    <rect x="30" y="290" width="44" height="48" rx="3" fill="#242440" stroke="#2e2e52" stroke-width="1.5"/>
    <circle cx="42" cy="304" r="4" fill="#3a3a4a"/>
    <circle cx="62" cy="304" r="4" fill="#3a3a4a"/>
    <circle cx="42" cy="326" r="4" fill="#3a3a4a"/>
    <circle cx="62" cy="326" r="4" fill="#3a3a4a"/>

    <!-- Cyan base accent -->
    <rect x="20" y="426" width="480" height="4" fill="#00ffd4" opacity="0.5"/>
  </svg>
</div>

<!-- ISOMETRIC VIEW -->
<div class="view">
  <h3>ISOMETRIC — Target Render</h3>
  <svg width="560" height="500" viewBox="0 0 560 500">
    <defs>
      <!-- Isometric transform helpers -->
      <!-- In true isometric: x-axis goes down-right at 30°, z-axis goes down-left at 30°, y-axis goes straight up -->
    </defs>
    <rect width="560" height="500" fill="#0a0a12"/>

    <!-- ═══ VAULT BODY (isometric box) ═══ -->
    <!-- Top face (lightest) -->
    <polygon points="280,60 470,155 280,250 90,155" fill="#242440" stroke="#2e2e52" stroke-width="1"/>
    <!-- Left face (front — door side, mid tone) -->
    <polygon points="90,155 280,250 280,410 90,315" fill="#1a1a2e" stroke="#242440" stroke-width="1"/>
    <!-- Right face (side, darkest) -->
    <polygon points="280,250 470,155 470,315 280,410" fill="#161628" stroke="#242440" stroke-width="1"/>

    <!-- ═══ DOOR (circle on left face, perspective-distorted to ellipse) ═══ -->
    <!-- The door is on the left/front face -->
    <!-- In isometric, a circle on the left face becomes a skewed ellipse -->

    <!-- Frame recess (dark ellipse) -->
    <ellipse cx="185" cy="278" rx="58" ry="90" fill="#0d0d14"
             transform="skewY(33.5) translate(-88,-145)"/>

    <!-- Door disc (brighter than wall) -->
    <ellipse cx="185" cy="278" rx="53" ry="84" fill="#3a3a4a"
             transform="skewY(33.5) translate(-88,-145)"/>

    <!-- ═══ SPINDLE WHEEL (cyan, on door face) ═══ -->
    <!-- Wheel ring -->
    <ellipse cx="185" cy="278" rx="20" ry="32" fill="none" stroke="#00ffd4" stroke-width="4"
             transform="skewY(33.5) translate(-88,-145)"/>
    <!-- Hub -->
    <ellipse cx="185" cy="278" rx="6" ry="9" fill="#00ffd4"
             transform="skewY(33.5) translate(-88,-145)"/>
    <!-- Spokes (simplified — 5 lines radiating from center) -->
    <g transform="skewY(33.5) translate(-88,-145)">
      <line x1="185" y1="278" x2="185" y2="246" stroke="#00ffd4" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="278" x2="204" y2="268" stroke="#00ffd4" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="278" x2="197" y2="296" stroke="#00ffd4" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="278" x2="173" y2="296" stroke="#00ffd4" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="278" x2="166" y2="268" stroke="#00ffd4" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ═══ COMBINATION DIAL (on door, off-center) ═══ -->
    <ellipse cx="198" cy="298" rx="7" ry="11" fill="#2e2e52" stroke="#3a3a4a" stroke-width="1"
             transform="skewY(33.5) translate(-88,-145)"/>

    <!-- ═══ HINGES (two blocks on left edge of front face) ═══ -->
    <!-- Top hinge -->
    <polygon points="82,188 92,183 92,203 82,208" fill="#242440" stroke="#2e2e52" stroke-width="0.8"/>
    <!-- Bottom hinge -->
    <polygon points="82,275 92,270 92,290 82,295" fill="#242440" stroke="#2e2e52" stroke-width="0.8"/>

    <!-- ═══ CYAN BASE GLOW ═══ -->
    <!-- Front base edge -->
    <line x1="90" y1="315" x2="280" y2="410" stroke="#00ffd4" stroke-width="2.5" opacity="0.6"/>
    <!-- Side base edge -->
    <line x1="280" y1="410" x2="470" y2="315" stroke="#00ffd4" stroke-width="2.5" opacity="0.6"/>

    <!-- ═══ LABELS ═══ -->
    <g font-family="monospace" font-size="8">
      <text x="280" y="30" fill="#666" text-anchor="middle" font-size="10">ISOMETRIC (camera top-right)</text>

      <line x1="130" y1="240" x2="30" y2="210" stroke="#555" stroke-width="0.5"/>
      <text x="10" y="206" fill="#666">DOOR</text>

      <line x1="155" y1="258" x2="30" y2="250" stroke="#00ffd4" stroke-width="0.5" opacity="0.5"/>
      <text x="10" y="248" fill="#00ffd4" font-size="7">WHEEL</text>

      <line x1="82" y1="196" x2="30" y2="175" stroke="#555" stroke-width="0.5"/>
      <text x="10" y="172" fill="#666">HINGE</text>

      <line x1="350" y1="100" x2="440" y2="60" stroke="#555" stroke-width="0.5"/>
      <text x="442" y="58" fill="#666">WALL</text>

      <line x1="280" y1="410" x2="330" y2="440" stroke="#00ffd4" stroke-width="0.5" opacity="0.5"/>
      <text x="332" y="438" fill="#00ffd4" font-size="7">CYAN GLOW</text>
    </g>
  </svg>
</div>

<!-- LEFT SIDE — with scene palette -->
<div class="view">
  <h3>LEFT SIDE</h3>
  <svg width="440" height="380" viewBox="0 0 440 380">
    <rect width="440" height="380" fill="#0a0a12"/>

    <!-- 1. Wall — STRUCTURE_1 -->
    <rect x="50" y="20" width="340" height="310" fill="#1a1a2e" stroke="#242440" stroke-width="2"/>

    <!-- 7. Door thickness — CONCRETE, protrudes from wall -->
    <rect x="40" y="50" width="18" height="250" fill="#3a3a4a" stroke="#2e2e52" stroke-width="1"/>

    <!-- 2. Frame lip — STRUCTURE_3 -->
    <rect x="46" y="42" width="8" height="266" fill="#2e2e52"/>

    <!-- 6. Hinges with barrel pins -->
    <rect x="26" y="95" width="22" height="42" rx="2" fill="#242440" stroke="#2e2e52" stroke-width="1"/>
    <circle cx="30" cy="116" r="7" fill="#2e2e52" stroke="#3a3a4a" stroke-width="1"/>

    <rect x="26" y="225" width="22" height="42" rx="2" fill="#242440" stroke="#2e2e52" stroke-width="1"/>
    <circle cx="30" cy="246" r="7" fill="#2e2e52" stroke="#3a3a4a" stroke-width="1"/>

    <!-- Cyan base accent -->
    <rect x="40" y="326" width="354" height="3" fill="#00ffd4" opacity="0.5"/>

    <!-- Labels -->
    <text x="44" y="348" fill="#00ffd4" font-size="9" font-family="monospace">◄ FRONT</text>
    <text x="386" y="348" fill="#555" text-anchor="end" font-size="9" font-family="monospace">BACK ►</text>

    <line x1="50" y1="365" x2="390" y2="365" stroke="#444" stroke-width="0.5"/>
    <text x="220" y="378" fill="#555" text-anchor="middle" font-size="10" font-family="monospace">10 units</text>
  </svg>
</div>

</body>
</html>
