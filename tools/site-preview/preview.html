<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #111118; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "../site/js/vendor/three.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { createGround } from '../src_site/js/buildings/ground.js';
import { createCitadelTower } from '../src_site/js/buildings/citadel-tower.js';
import { createVault } from '../src_site/js/buildings/vault.js';
import { createAntennaArray } from '../src_site/js/buildings/antenna-array.js';
import { createShieldWall } from '../src_site/js/buildings/shield-wall.js';

const canvas = document.getElementById('c');
const w = canvas.clientWidth;
const h = canvas.clientHeight;

// Renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(w, h, false);
renderer.setClearColor(0x0a0a0f, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Camera — 2:1 dimetric
const aspect = w / h;
const d = 12;
const camera = new THREE.OrthographicCamera(
  -d * aspect, d * aspect, d, -d, -1000, 1000
);
camera.position.set(50, 50, 50);
camera.lookAt(0, 0, 0);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

// Lights
const ambient = new THREE.AmbientLight(0x6a6a8a, 0.6);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x8888aa, 0x333344, 0.8);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(10, 20, 10);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
scene.add(dir);

const fill = new THREE.DirectionalLight(0x6688aa, 0.6);
fill.position.set(-10, 8, -10);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x5566aa, 0.4);
rim.position.set(-5, 5, -15);
scene.add(rim);

// ─── OBJECT UNDER REVIEW ────────────────────────────────────

const obj = createVault();
scene.add(obj);

// ─── END OBJECT ──────────────────────────────────────────────

// Expose for CDP debugging
window.__scene = scene;
window.__camera = camera;
window.__renderer = renderer;

// Turntable — rotate quickly, pause on 4 isometric faces
const STOPS = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2]; // 0°, 90°, 180°, 270°
const PAUSE_MS = 1500;   // hold each face
const SPIN_SPEED = 0.03; // radians per frame between stops
const SNAP_THRESHOLD = 0.04; // how close to snap to a stop

let currentStop = 0;
let paused = false;
let pauseStart = 0;

function render(now) {
  if (paused) {
    if (now - pauseStart >= PAUSE_MS) {
      paused = false;
      currentStop = (currentStop + 1) % STOPS.length;
    }
  } else {
    const target = STOPS[currentStop];
    let angle = scene.rotation.y % (2 * Math.PI);
    if (angle < 0) angle += 2 * Math.PI;

    let diff = target - angle;
    if (diff < 0) diff += 2 * Math.PI;

    if (diff < SNAP_THRESHOLD || diff > 2 * Math.PI - SNAP_THRESHOLD) {
      scene.rotation.y = target;
      paused = true;
      pauseStart = now;
    } else {
      scene.rotation.y += SPIN_SPEED;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
window.__rendered = true;
</script>
</body>
</html>
