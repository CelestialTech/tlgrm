[package]
name = "telebox"
version = "0.1.0"
edition = "2021"
description = "TeleBox — the plugin-hosted controller for the Tlgrm client (GPUI)"

[[bin]]
name = "telebox"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.15.1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.15.1", features = ["font-kit"] }
serde_json = "1"
