[package]
name = "tlgrm-updates"
version = "1.0.0"
edition = "2021"
description = "Serves Telegram Desktop update manifests and packages for Tlgrm"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util"] }
tower-http = { version = "0.5", default-features = false, features = ["trace"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
serde_json = "1"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

# Tuned for size, not rebuild speed: this binary lives on a small VM where
# MB and RSS matter more than how long a release build takes. Same profile
# the sirenpost daemon on the same host uses.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
